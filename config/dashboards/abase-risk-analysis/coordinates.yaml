dashboard: abase-risk-analysis
version: '1.0'
description: Pixel-based panel coordinates (no LLM required for cropping)
image_dimensions:
  width: 1920
  height: 1460

note: |
  These coordinates were measured from a reference screenshot.
  They should work for all screenshots with the same dashboard layout and resolution.
  Adjust if your screenshots have different dimensions.

panels:
  S1-L-write:
    # Row 1, Left column, Bottom panel: Write Total (写总和)
    x: 30
    y: 250
    width: 615
    height: 153

  S1-R-write:
    # Row 1, Right column, Bottom panel: Write per DC (写分DC)
    x: 655
    y: 250
    width: 630
    height: 153

  S1-L-read:
    # Row 1, Left column, Top panel: Read Total (读总和)
    x: 30
    y: 76
    width: 615
    height: 168

  S1-R-read:
    # Row 1, Right column, Top panel: Read per DC (读分DC)
    x: 655
    y: 76
    width: 630
    height: 168

  S2-L-disk:
    # Row 2, Left panel (Disk Usage w/ top 3 sub tables) - includes S2 section header
    x: 30
    y: 592
    width: 615
    height: 185

  S2-R-partition:
    # Row 2, Right panel (Storage Capacity Partition Perspective Max)
    x: 655
    y: 592
    width: 630
    height: 185

  S3-L-qps_vs_quota:
    # Row 3, Top-left panel (QPS vs Quota) - includes S3 section header
    x: 30
